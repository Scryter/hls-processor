name: HLS Video Processor

on:
  workflow_dispatch:           # manual trigger / webhook trigger from app
    inputs:
      verifyConfigurationOnly:
        description: Verify the PRD R2 bucket without processing videos
        required: false
        default: false
        type: boolean
      batchLimit:
        description: Maximum number of exercises to process (1–200)
        required: false
        default: 200
        type: number

# Minimal GITHUB_TOKEN permissions - this job only reads the repo
permissions:
  contents: read

jobs:
  process-hls:
    runs-on: ubuntu-latest
    # Avoid sending production secrets when workflow_dispatch targets another ref.
    # The PRD environment must also be restricted to main in repository settings;
    # that environment policy is the enforcement boundary if this file changes.
    if: github.ref == 'refs/heads/main'
    environment: PRD
    timeout-minutes: 30

    steps:
      - name: Verify production R2 bucket without processing media
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ "${R2_BUCKET_NAME:-}" != "prd-trainlab" ]; then
            echo "::error::PRD R2 bucket does not match the expected TrainLab bucket."
            exit 1
          fi
          echo "PRD R2 bucket matches the expected TrainLab bucket."

      # Pinned to commit SHA to prevent tag-poisoning supply chain attacks
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: ${{ inputs.verifyConfigurationOnly != true }}

      - name: Setup Node.js
        if: ${{ inputs.verifyConfigurationOnly != true }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '24'
          # Disable npm cache to avoid cache corruption issues
          # cache: 'npm'

      - name: Install dependencies
        if: ${{ inputs.verifyConfigurationOnly != true }}
        # node-fetch removed - supported Node.js has native fetch; @aws-sdk/client-s3 only
        run: npm ci --omit=dev

      # Untrusted videos are decoded in a networkless, credential-free container.
      - name: Build isolated media tools image
        if: ${{ inputs.verifyConfigurationOnly != true }}
        run: docker build --pull --file Dockerfile.media-tools --tag trainlab-media-tools:processor .

      - name: Run HLS processor
        if: ${{ inputs.verifyConfigurationOnly != true }}
        env:
          PROCESSOR_MAX_ITEMS: ${{ inputs.batchLimit || 200 }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          APP_URL:              ${{ secrets.APP_URL }}
          PROCESSOR_API_KEY:    ${{ secrets.PROCESSOR_API_KEY }}
          PROCESSOR_MEDIA_IMAGE: trainlab-media-tools:processor
        run: node scripts/processor.js
