name: HLS Video Processor

on:
  workflow_dispatch:           # manual trigger / webhook trigger from app
    inputs:
      batchLimit:
        description: Maximum number of exercises to process (1–200)
        required: false
        default: 200
        type: number

# Minimal GITHUB_TOKEN permissions - this job only reads the repo
permissions:
  contents: read

jobs:
  process-hls:
    runs-on: ubuntu-latest
    environment: PRD
    timeout-minutes: 30

    steps:
      # Pinned to commit SHA to prevent tag-poisoning supply chain attacks
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '24'
          # Disable npm cache to avoid cache corruption issues
          # cache: 'npm'

      - name: Install dependencies
        # node-fetch removed - supported Node.js has native fetch; @aws-sdk/client-s3 only
        run: npm install --omit=dev

      # Untrusted videos are decoded in a networkless, credential-free container.
      - name: Build isolated media tools image
        run: docker build --pull --file Dockerfile.media-tools --tag trainlab-media-tools:processor .

      - name: Run HLS processor
        env:
          PROCESSOR_MAX_ITEMS: ${{ inputs.batchLimit || 200 }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          APP_URL:              ${{ secrets.APP_URL }}
          PROCESSOR_API_KEY:    ${{ secrets.PROCESSOR_API_KEY }}
          PROCESSOR_MEDIA_IMAGE: trainlab-media-tools:processor
        run: node scripts/processor.js
