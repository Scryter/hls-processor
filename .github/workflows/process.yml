name: HLS Video Processor

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:           # manual trigger / webhook trigger from app

# Minimal GITHUB_TOKEN permissions - this job only reads the repo
permissions:
  contents: read

jobs:
  process-hls:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      # Pinned to commit SHA to prevent tag-poisoning supply chain attacks
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # node-fetch removed - Node 20 has native fetch; @aws-sdk/client-s3 only
        run: npm install --omit=dev

      # Use system FFmpeg (pre-installed on ubuntu-latest) instead of downloading static binary
      - name: Verify FFmpeg availability
        id: ffmpeg_check
        run: |
          if command -v ffmpeg >/dev/null; then
            echo "FFmpeg already installed: $(ffmpeg -version | head -1)"
            echo "ffmpeg_path=$(which ffmpeg)" >> $GITHUB_OUTPUT
          else
            echo "FFmpeg not found, will install..."
            echo "ffmpeg_path=" >> $GITHUB_OUTPUT
          fi

      - name: Install FFmpeg (fallback if not present)
        if: steps.ffmpeg_check.outputs.ffmpeg_path == ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          echo "ffmpeg_path=$(which ffmpeg)" >> $GITHUB_OUTPUT

      - name: Run HLS processor
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          APP_URL:              ${{ secrets.APP_URL }}
          PROCESSOR_API_KEY:    ${{ secrets.PROCESSOR_API_KEY }}
          FFMPEG_PATH:          ${{ steps.ffmpeg_check.outputs.ffmpeg_path != '' && steps.ffmpeg_check.outputs.ffmpeg_path || steps.ffmpeg_install.outputs.ffmpeg_path }}
        run: node scripts/processor.js